name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build universal DMG
    # Intel runner: build both architectures explicitly and merge them below.
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build Intel binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build Apple Silicon binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/smart-screen \
            target/aarch64-apple-darwin/release/smart-screen \
            -output target/release/smart-screen-universal
          lipo -info target/release/smart-screen-universal

      - name: Package app and DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh \
            target/release/smart-screen-universal \
            universal

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SmartScreen-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
